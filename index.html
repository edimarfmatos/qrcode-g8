<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gerador de QR Code - Depósito</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
}

/* Área da folha A4 */
.folha {
    width: 21cm;
    height: 29.7cm;
    padding: 10px;
}

/* Container das etiquetas */
.container-etiquetas {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

/* Etiqueta individual */
.etiqueta {
    width: 20cm;
    height: 5cm;
    border: 1px solid black;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px;
    box-sizing: border-box;
}

/* Texto grande */
.codigo {
    font-size: 150px;
    font-weight: bold;
}

/* QR */
.qrcode {
    width: 4cm;
    height: 4cm;
}

/* Área de inputs */
.inputs {
    margin-bottom: 20px;
}

/* Impressão */
@media print {
    button, .inputs h2 {
        display: none;
    }

    body {
        margin: 0;
    }
}
</style>
</head>

<body>

<div class="inputs">
    <h2>Gerar 6 Etiquetas</h2>

    <input type="text" id="campo1" placeholder="Código 1">
    <input type="text" id="campo2" placeholder="Código 2">
    <input type="text" id="campo3" placeholder="Código 3">
    <input type="text" id="campo4" placeholder="Código 4">
    <input type="text" id="campo5" placeholder="Código 5">
    <input type="text" id="campo6" placeholder="Código 6">

    <button onclick="gerar()">Gerar Etiquetas</button>
    <button onclick="window.print()">Imprimir</button>
</div>

<div class="folha">
    <div class="container-etiquetas" id="container"></div>
</div>

<script>
function gerar() {

    const container = document.getElementById("container");
    container.innerHTML = "";

    for (let i = 1; i <= 6; i++) {

        let valor = document.getElementById("campo" + i).value;

        if (valor.trim() !== "") {

            let etiqueta = document.createElement("div");
            etiqueta.className = "etiqueta";

            let codigo = document.createElement("div");
            codigo.className = "codigo";
            codigo.innerText = valor;

            let qrDiv = document.createElement("div");
            qrDiv.className = "qrcode";

            etiqueta.appendChild(codigo);
            etiqueta.appendChild(qrDiv);
            container.appendChild(etiqueta);

            new QRCode(qrDiv, {
                text: valor,
                width: 150,
                height: 150
            });
        }
    }
}
</script>

</body>
</html>
